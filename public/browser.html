<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>Browser — Cmd Remote</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-solid: #13161d;
    --border: rgba(255, 255, 255, 0.09);
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --grad: linear-gradient(135deg, #8b5cf6, #06b6d4);
    --error: #ff6b81;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: flex; flex-direction: column;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 9px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 60%; height: 60%; }
  header h1 { font-size: 14px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
  header .navLink {
    font-size: 18px; text-decoration: none; padding: 6px 8px; border-radius: 9px; color: var(--text);
  }
  header .navLink:active { background: rgba(255,255,255,.1); }

  /* Tab strip */
  #tabstrip {
    display: flex; gap: 6px; align-items: center;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
  }
  .btab {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    touch-action: manipulation;
  }
  .btab.active {
    background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(6,182,212,.15));
    border-color: rgba(139,92,246,.4);
    color: var(--text);
  }
  #tabAddBtn {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }

  /* Controls row */
  #controls {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #controls input {
    flex: 1;
    min-width: 140px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    font-family: inherit;
  }
  #controls input:focus { border-color: rgba(139,92,246,.55); }
  #controls button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    flex-shrink: 0;
  }
  #controls button:active { background: rgba(139,92,246,.25); }
  #controls button.latched { background: var(--grad); border-color: transparent; }
  #liveBtn.live { background: linear-gradient(135deg, #ff6b81, #f59e0b); border-color: transparent; }

  /* Screenshot view */
  #stage {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
    background: #000;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y; /* content swipe scrolls like a browser */
    scrollbar-width: thin;
  }
  #stage::-webkit-scrollbar { width: 5px; }
  #stage::-webkit-scrollbar-thumb { background: rgba(139,92,246,.4); border-radius: 3px; }
  #shot {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: auto;
    touch-action: manipulation;
  }
  #status {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(19,22,29,.92);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 5;
  }
  #tip {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(19,22,29,.92);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
  #typeRow {
    display: none;
    gap: 6px;
    padding: 8px 10px;
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #typeRow input {
    flex: 1;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  #typeRow button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
  <h1>Browser</h1>
  <a href="/index.html" class="navLink" title="Chat">💬</a>
  <a href="/files.html" class="navLink" title="Files">📁</a>
</header>

<div id="tabstrip"></div>
<div id="controls">
  <input id="urlInput" placeholder="Enter URL…" autocomplete="off">
  <button id="goBtn">Go</button>
  <button id="backBtn">←</button>
  <button id="fwdBtn">→</button>
  <button id="reloadBtn">⟳</button>
  <button id="typeBtn">⌨ Type</button>
  <button id="liveBtn" class="live">● LIVE</button>
</div>
<div id="stage">
  <img id="shot" alt="browser view">
  <div id="status">connecting…</div>
  <div id="tip">Tap the page to click · drag to scroll</div>
</div>
<div id="typeRow">
  <input id="typeInput" placeholder="Type into the browser page…" autocomplete="off">
  <button id="typeSend">Send</button>
</div>

<script src="/scrollbar.js"></script>
<script>
(function () {
  const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('cmd_remote_token') || '';
  const auth = token ? { 'Authorization': 'Bearer ' + token } : {};
  const $ = (id) => document.getElementById(id);
  const shot = $('shot'), statusEl = $('status'), tabstrip = $('tabstrip');
  const urlInput = $('urlInput'), liveBtn = $('liveBtn'), typeRow = $('typeRow');

  let tabs = [];
  let activeTab = null;
  let live = true;
  let refreshTimer = null;
  let stageScroll = { top: 0, left: 0 };

  const stage = $('stage');

  // ---- Visual scrollbar indicator (decorative; native swipe scrolls) ----
  let sbIndicator = null;
  function syncScrollbar() {
    if (sbIndicator) { sbIndicator.destroy(); sbIndicator = null; }
    sbIndicator = window.ScrollbarIndicator.bind(stage);
    requestAnimationFrame(() => { if (sbIndicator) sbIndicator.update(); });
  }
  syncScrollbar();
  // Keep the thumb in sync as screenshots swap (content height changes).
  function updateScrollbar() { if (sbIndicator) sbIndicator.update(); }
  stage.addEventListener('scroll', updateScrollbar, { passive: true });

  async function api(url, opts) {
    const r = await fetch(url, { headers: auth, ...opts });
    if (r.status === 401) { showTokenPrompt(); throw new Error('Unauthorized — enter your token'); }
    return r;
  }
  async function post(url, body) {
    const r = await api(url, { method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return r.json().catch(() => ({}));
  }

  // ---- Token fallback: if opened without ?token= (e.g. Android WebView
  // with empty localStorage), prompt for the token instead of a dead end. ----
  const loginOverlay = document.createElement('div');
  loginOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(11,13,18,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:24px;color:var(--text)';
  loginOverlay.innerHTML = '<div style="font-size:15px;font-weight:700">Enter your access token</div>' +
    '<input id="tokenInput" type="password" placeholder="Token from your PC" autocomplete="off" style="width:100%;max-width:320px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:12px 14px;outline:none">' +
    '<button id="tokenBtn" style="border:1px solid var(--border);background:var(--grad);color:#fff;border-radius:10px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer">Connect</button>' +
    '<div id="tokenErr" style="color:var(--error);font-size:12px;min-height:14px"></div>';
  document.body.appendChild(loginOverlay);
  function showTokenPrompt() {
    loginOverlay.style.display = 'flex';
    const inp = loginOverlay.querySelector('#tokenInput');
    const btn = loginOverlay.querySelector('#tokenBtn');
    const err = loginOverlay.querySelector('#tokenErr');
    btn.onclick = async () => {
      const t = inp.value.trim();
      if (!t) { err.textContent = 'Enter the token shown on your PC.'; return; }
      try {
        localStorage.setItem('cmd_remote_token', t);
        const probe = await fetch('/api/browser/tabs', { headers: { Authorization: 'Bearer ' + t } });
        if (!probe.ok) { err.textContent = 'That token did not work.'; return; }
        loginOverlay.style.display = 'none';
        location.reload();
      } catch { err.textContent = 'Could not reach the server.'; }
    };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
    setTimeout(() => inp.focus(), 50);
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function refreshTabs() {
    try {
      const r = await api('/api/browser/tabs');
      const j = await r.json();
      if (!j.available) { setStatus('Browser not running — tap to retry'); return false; }
      tabs = j.tabs || [];
      if (tabs.length && !tabs.some((t) => t.id === activeTab)) {
        activeTab = tabs[0].id;
      }
      renderTabs();
      return true;
    } catch (e) { setStatus('Browser unreachable'); return false; }
  }

  function renderTabs() {
    tabstrip.innerHTML = '';
    for (const t of tabs) {
      const el = document.createElement('button');
      el.className = 'btab' + (t.id === activeTab ? ' active' : '');
      el.textContent = t.title || t.url || 'tab';
      el.addEventListener('click', () => { activeTab = t.id; refreshShot(); refreshTabs(); });
      tabstrip.appendChild(el);
    }
    const add = document.createElement('button');
    add.id = 'tabAddBtn';
    add.textContent = '+';
    add.addEventListener('click', async () => {
      const j = await post('/api/browser/newtab', {});
      if (j.ok) { activeTab = j.id; refreshTabs(); refreshShot(); }
    });
    tabstrip.appendChild(add);
  }

  let shotBusy = false;
  let browserDown = false;
  async function refreshShot() {
    if (shotBusy) return; // never overlap requests
    if (browserDown) return; // back off when the browser is down
    if (!activeTab) { setStatus('No browser tabs — the agent may open one'); return; }
    // Preserve the user's scroll position across screenshot refreshes so the
    // view doesn't jump back to the top on every live update.
    stageScroll = { top: stage.scrollTop, left: stage.scrollLeft };
    shotBusy = true;
    try {
      const r = await api('/api/browser/screenshot?tab=' + encodeURIComponent(activeTab));
      if (!r.ok) {
        browserDown = true;
        setStatus('Browser not running — tap to retry');
        return;
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const old = shot.src;
      shot.src = url;
      // Restore scroll after the new frame actually decodes.
      shot.onload = () => {
        stage.scrollTop = stageScroll.top;
        stage.scrollLeft = stageScroll.left;
        updateScrollbar();
      };
      if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
      setStatus('live');
    } catch { setStatus('Screenshot error'); }
    finally { shotBusy = false; }
  }

  // Retry when the browser comes back (tap status or the LIVE toggle).
  function retryBrowser() {
    browserDown = false;
    refreshTabs().then((ok) => { if (ok) { refreshShot(); startLoop(); } });
  }
  statusEl.addEventListener('click', () => { if (browserDown) retryBrowser(); });

  function toggleLive() {
    live = !live;
    liveBtn.classList.toggle('live', live);
    liveBtn.textContent = live ? '● LIVE' : '⏸ paused';
    clearInterval(refreshTimer);
    if (live) {
      refreshTabs();
      refreshShot();
      refreshTimer = setInterval(tick, 1500);
    }
  }
  // One loop tick: keep tabs fresh AND the screenshot current.
  function tick() {
    if (browserDown) { refreshTabs(); return; }
    refreshShot();
    // Poll tabs occasionally so new agent-opened tabs appear.
    if (Math.random() < 0.2) refreshTabs();
  }

  // Tap-to-click: send click at screenshot coords (accounting for scroll).
  shot.addEventListener('click', async (e) => {
    if (!activeTab) return;
    const rect = shot.getBoundingClientRect();
    const scaleX = shot.naturalWidth ? shot.naturalWidth / rect.width : 1;
    const scaleY = shot.naturalHeight ? shot.naturalHeight / rect.height : 1;
    const x = Math.round((e.clientX - rect.left) * scaleX);
    const y = Math.round((e.clientY - rect.top + stage.scrollTop) * scaleY);
    const j = await post('/api/browser/click', { tab: activeTab, x, y }).catch(() => ({}));
    if (j.error) setStatus('click failed: ' + j.error);
    if (live) refreshShot();
  });

  $('goBtn').addEventListener('click', async () => {
    let u = urlInput.value.trim();
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    await post('/api/browser/navigate', { tab: activeTab, url: u });
    if (live) setTimeout(refreshShot, 1200);
  });
  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('goBtn').click(); });

  $('backBtn').addEventListener('click', async () => {
    await post('/api/browser/eval', { tab: activeTab, expression: 'history.back(); "ok"' });
    if (live) setTimeout(refreshShot, 1000);
  });
  $('fwdBtn').addEventListener('click', async () => {
    await post('/api/browser/eval', { tab: activeTab, expression: 'history.forward(); "ok"' });
    if (live) setTimeout(refreshShot, 1000);
  });
  $('reloadBtn').addEventListener('click', async () => {
    await post('/api/browser/eval', { tab: activeTab, expression: 'location.reload(); "ok"' });
    if (live) setTimeout(refreshShot, 1200);
  });

  $('typeBtn').addEventListener('click', () => {
    typeRow.style.display = typeRow.style.display === 'flex' ? 'none' : 'flex';
    if (typeRow.style.display === 'flex') $('typeInput').focus();
  });
  $('typeSend').addEventListener('click', async () => {
    const text = $('typeInput').value;
    if (!text) return;
    await post('/api/browser/type', { tab: activeTab, text });
    $('typeInput').value = '';
    if (live) refreshShot();
  });
  $('typeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('typeSend').click(); });

  liveBtn.addEventListener('click', toggleLive);

  // Boot
  (async () => {
    const ok = await refreshTabs();
    if (ok) {
      refreshShot();
      refreshTimer = setInterval(tick, 1500);
    } else {
      setStatus('Browser not running — tap to retry');
    }
  })();
})();
</script>
</body>
</html>
