<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Command Code Terminal</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/xterm.css">
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --grad: linear-gradient(135deg, #8b5cf6, #06b6d4);
    --error: #ff6b81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: flex; flex-direction: column;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    width: 420px; height: 420px;
    top: -140px; right: -100px;
    background: rgba(139, 92, 246, 0.14);
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
  }
  header {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    padding: 10px 16px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 9px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.45);
    flex-shrink: 0;
  }
  .logo-mark svg { width: 60%; height: 60%; }
  header h1 { font-size: 14px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
  .status {
    font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 20px; font-weight: 500;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  .status .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .status .dot.off { background: var(--error); }
  #term {
    flex: 1;
    min-height: 0;
    padding: 10px 6px;
    overflow: hidden;
  }
  .xterm { height: 100%; }
  .hint {
    font-size: 10px; color: var(--muted); text-align: center; padding: 5px;
    flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border);
    backdrop-filter: blur(18px);
  }
</style>
</head>
<body>
<header>
  <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
  <h1>Command Code Terminal</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
</header>
<div id="term"></div>
<div class="hint">Full terminal — tap to focus, swipe to scroll. Ctrl shortcuts work via the toolbar/keyboard.</div>

<script src="/xterm.js"></script>
<script src="/fit.js"></script>
<script>
(function () {
  const termEl = document.getElementById('term');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const token = new URLSearchParams(location.search).get('token');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws` + (token ? `?token=${encodeURIComponent(token)}` : '');

  const term = new Terminal({
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 5000,
    theme: { background: '#0b0d12', foreground: '#e6e9ef', cursor: '#8b5cf6', selectionBackground: 'rgba(139,92,246,.35)' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(termEl);
  fit.fit();

  let ws = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusText.textContent = text || (state === 'on' ? 'connected' : state === 'off' ? 'disconnected' : 'connecting');
  }
  function connect() {
    clearTimeout(reconnectTimer);
    setStatus('', 'connecting');
    ws = new WebSocket(url);
    ws.onopen = () => {
      setStatus('on');
      reconnectDelay = 1000;
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };
    ws.onclose = () => {
      setStatus('off', 'disconnected — tap to reconnect');
      // Auto-reconnect with backoff (phone backgrounding kills sockets).
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'output') term.write(msg.data);
      else if (msg.type === 'exit') { setStatus('off', 'session ended — tap to restart'); term.write('\r\n[process exited]\r\n'); clearTimeout(reconnectTimer); }
    };
  }
  // Tap the header/status to reconnect immediately.
  document.querySelector('header').addEventListener('click', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) { clearTimeout(reconnectTimer); connect(); }
  });

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data }));
  });

  window.addEventListener('resize', () => {
    fit.fit();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });

  // Tap to focus + show keyboard on mobile
  termEl.addEventListener('click', () => term.focus());

  connect();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
