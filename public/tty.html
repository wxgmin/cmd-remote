<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Command Code Terminal</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/xterm.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0f1115; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: #171a21;
    border-bottom: 1px solid #262b36;
    color: #e6e9ef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    flex-shrink: 0;
  }
  header .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #4f8cff, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
  }
  header h1 { font-size: 14px; font-weight: 600; flex: 1; }
  .status { font-size: 11px; color: #8b93a3; display: flex; align-items: center; gap: 5px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb020; }
  .status .dot.on { background: #34d399; }
  .status .dot.off { background: #ff6b6b; }
  #term {
    flex: 1;
    min-height: 0;
    padding: 8px 4px;
    overflow: hidden;
  }
  .xterm { height: 100%; }
  .hint { font-size: 10px; color: #8b93a3; text-align: center; padding: 4px; flex-shrink: 0; background: #171a21; border-top: 1px solid #262b36; }
</style>
</head>
<body>
<header>
  <div class="logo">&gt;_</div>
  <h1>Command Code Terminal</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
</header>
<div id="term"></div>
<div class="hint">Full terminal — tap to focus, swipe to scroll. Ctrl shortcuts work via the toolbar/keyboard.</div>

<script src="/xterm.js"></script>
<script src="/fit.js"></script>
<script>
(function () {
  const termEl = document.getElementById('term');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const token = new URLSearchParams(location.search).get('token');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws` + (token ? `?token=${encodeURIComponent(token)}` : '');

  const term = new Terminal({
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 5000,
    theme: { background: '#0f1115', foreground: '#e6e9ef', cursor: '#4f8cff' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(termEl);
  fit.fit();

  let ws = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusText.textContent = text || (state === 'on' ? 'connected' : state === 'off' ? 'disconnected' : 'connecting');
  }
  function connect() {
    clearTimeout(reconnectTimer);
    setStatus('', 'connecting');
    ws = new WebSocket(url);
    ws.onopen = () => {
      setStatus('on');
      reconnectDelay = 1000;
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };
    ws.onclose = () => {
      setStatus('off', 'disconnected — tap to reconnect');
      // Auto-reconnect with backoff (phone backgrounding kills sockets).
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'output') term.write(msg.data);
      else if (msg.type === 'exit') { setStatus('off', 'session ended — tap to restart'); term.write('\r\n[process exited]\r\n'); clearTimeout(reconnectTimer); }
    };
  }
  // Tap the header/status to reconnect immediately.
  document.querySelector('header').addEventListener('click', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) { clearTimeout(reconnectTimer); connect(); }
  });

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data }));
  });

  window.addEventListener('resize', () => {
    fit.fit();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });

  // Tap to focus + show keyboard on mobile
  termEl.addEventListener('click', () => term.focus());

  connect();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
