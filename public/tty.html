<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>Command Code Terminal</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/xterm.css">
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --grad: linear-gradient(135deg, #8b5cf6, #06b6d4);
    --error: #ff6b81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: flex; flex-direction: column;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    width: 420px; height: 420px;
    top: -140px; right: -100px;
    background: rgba(139, 92, 246, 0.14);
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
  }
  header {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    padding: 10px 16px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 9px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.45);
    flex-shrink: 0;
  }
  .logo-mark svg { width: 60%; height: 60%; }
  header h1 { font-size: 14px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
  header .navLink {
    font-size: 18px;
    text-decoration: none;
    padding: 6px 8px;
    border-radius: 9px;
    color: var(--text);
    flex-shrink: 0;
  }
  header .navLink:active { background: rgba(255,255,255,.1); }
  .status {
    font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 20px; font-weight: 500;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  .status .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .status .dot.off { background: var(--error); }
  #term {
    flex: 1;
    min-height: 0;
    padding: 10px 6px;
    overflow: hidden;
    touch-action: pan-y; /* let vertical touch gestures scroll the terminal */
    position: relative;
  }
  .xterm { height: 100%; }
  /* Hide the native PC scrollbar — replaced by the gesture scrub strip */
  .xterm .xterm-viewport { scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; width: 0; }
  /* Gesture scrub strip (same pattern as files.html/browser.html) */
  .gstrip {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 36px;
    touch-action: none;
    z-index: 5;
    cursor: pointer;
  }
  .gstrip .gthumb {
    position: absolute; right: 4px; width: 8px; border-radius: 4px;
    background: rgba(139, 92, 246, 0.55); min-height: 30px;
    opacity: 0; transition: opacity .15s ease; pointer-events: none;
  }
  .gstrip:active .gthumb, .gstrip:hover .gthumb { opacity: 1; }
  .gstrip.dragging { background: rgba(139,92,246,.07); }
  .gstrip .gline {
    position: absolute; left: 0; right: 0; height: 2px;
    background: rgba(139,92,246,.4); pointer-events: none; opacity: 0;
  }
  .gstrip.dragging .gline { opacity: 1; }
  /* Pause output button state */
  #kPause.latched { background: linear-gradient(135deg, #ff6b81, #f59e0b); border-color: transparent; color: #fff; }
  /* Tab bar */
  #tabbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(6,182,212,.15));
    border-color: rgba(139,92,246,.4);
    color: var(--text);
  }
  .tab .x {
    width: 18px; height: 18px;
    border: none; background: none;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tab .x:active { background: rgba(255,255,255,.12); color: var(--error); }
  #tabAdd {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: 1px dashed var(--border);
    border-radius: 9px;
    background: none;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #tabAdd:active { background: rgba(255,255,255,.08); color: var(--text); }
  /* Mobile toolbar */
  #toolbar {
    display: none;
    flex-shrink: 0;
    padding: 8px;
    gap: 8px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(18px);
    flex-wrap: wrap;
    align-items: center;
    -webkit-user-select: none;
    user-select: none;
  }
  #toolbar button {
    flex: 1 1 0;
    min-width: 44px;
    height: 42px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: var(--text);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 4px;
    padding: 0 6px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #toolbar button:active { background: rgba(139,92,246,.25); }
  #toolbar button.latched {
    background: var(--grad);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(139,92,246,.4);
  }
  /* Keyboard lock is ON: button turns red and clearly visible */
  #toolbar button.locked {
    background: linear-gradient(135deg, #ff6b81, #f59e0b);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255, 107, 129, 0.5);
  }
  #toolbar .sep { flex: 0 0 1px; height: 30px; align-self: center; background: var(--border); }
  .hint {
    font-size: 10px; color: var(--muted); text-align: center; padding: 5px;
    flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border);
    backdrop-filter: blur(18px);
  }
  /* Show the toolbar only on coarse pointers (phones/tablets) */
  @media (pointer: coarse) {
    #toolbar { display: flex; }
    .hint { display: none; }
  }
  /* Up-arrow scroll hint while output is streaming past the bottom */
  #scrollHint {
    position: absolute;
    bottom: 84px;
    right: 10px;
    z-index: 20;
    display: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(19,22,29,.92);
    color: var(--text);
    font-size: 18px;
    align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
  <h1>Command Code Terminal</h1>
  <a href="/files.html" class="navLink" title="Browse files">📁</a>
  <a href="/browser.html" class="navLink" title="Live browser">🌐</a>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
</header>
<div id="tabbar" aria-label="Terminal tabs"></div>
<div id="term"></div>
<div id="toolbar" aria-label="Terminal keys">
  <button id="kCtrl" title="Hold Ctrl for shortcuts (Ctrl+C, Ctrl+D…)">Ctrl</button>
  <button id="kShift" title="Hold Shift for Shift+Tab, arrows, and uppercase">Shift</button>
  <button id="kEsc" title="Escape">Esc</button>
  <button id="kTab" title="Tab">Tab</button>
  <span class="sep"></span>
  <button id="kUp" title="Arrow up">↑</button>
  <button id="kDown" title="Arrow down">↓</button>
  <button id="kLeft" title="Arrow left">←</button>
  <button id="kRight" title="Arrow right">→</button>
  <span class="sep"></span>
  <button id="kEnter" title="Enter">↵</button>
  <span class="sep"></span>
  <button id="kPause" title="Pause output (stop the flood so you can read)">⏸</button>
  <button id="kbBtn" title="Show / hide keyboard">⌨</button>
  <button id="kbLock" title="Lock keyboard: never auto-open">🔒</button>
</div>
<button id="scrollHint" title="Jump to latest output">↓</button>
<div class="hint">Full terminal. Tap to focus, swipe to scroll, Ctrl shortcuts via the toolbar or keyboard.</div>

<script src="/xterm.js"></script>
<script src="/fit.js"></script>
<script>
(function () {
  const termEl = document.getElementById('term');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const scrollHint = document.getElementById('scrollHint');
  const token = new URLSearchParams(location.search).get('token');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';

  // Nav links (Files/Browser) need the token in the URL to authenticate.
  if (token) {
    for (const a of document.querySelectorAll('header .navLink')) {
      const href = a.getAttribute('href');
      if (href && href.startsWith('/') && !href.includes('token=')) {
        a.setAttribute('href', href + '?token=' + encodeURIComponent(token));
      }
    }
  }

  const term = new Terminal({
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 5000,
    theme: { background: '#0b0d12', foreground: '#e6e9ef', cursor: '#8b5cf6', selectionBackground: 'rgba(139,92,246,.35)' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(termEl);
  fit.fit();

  // Start at the bottom (latest output) by default.
  requestAnimationFrame(() => {
    if (viewport) viewport.scrollTop = viewport.scrollHeight;
  });

  // --- Scrolling: native momentum touch scroll + gesture scrub strip,
  // auto-stick to the bottom while output streams (rAF-coalesced),
  // free scroll-up, pause button to stop the flood.
  const viewport = termEl.querySelector('.xterm-viewport');
  let stickToBottom = true;
  let followRaf = null;
  function atBottom() {
    return !viewport || viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight < 8;
  }
  function scrollToLatest() {
    if (!viewport) return;
    // Coalesce: never scroll synchronously per write; schedule once per frame.
    if (followRaf) return;
    followRaf = requestAnimationFrame(() => {
      followRaf = null;
      viewport.scrollTop = viewport.scrollHeight;
      refreshScrollHint();
    });
  }
  function refreshScrollHint() {
    const near = atBottom();
    scrollHint.style.display = near ? 'none' : 'flex';
    if (near) stickToBottom = true;
  }
  if (viewport) {
    // User-initiated scroll: stay put (stick-to-bottom re-engages only at
    // the actual bottom — a tap that doesn't scroll never disengages it).
    viewport.addEventListener('scroll', () => {
      stickToBottom = atBottom();
      refreshScrollHint();
    }, { passive: true });
  }

  // ---- Gesture scrub strip (wide, touch-friendly, replaces the PC bar) ----
  const gstrip = document.createElement('div');
  gstrip.className = 'gstrip';
  const gthumb = document.createElement('div');
  gthumb.className = 'gthumb';
  const gline = document.createElement('div');
  gline.className = 'gline';
  gstrip.appendChild(gthumb);
  gstrip.appendChild(gline);
  termEl.appendChild(gstrip); // anchored inside #term, below the header
  let gDragging = false;
  function gUpdateThumb() {
    if (!viewport) return;
    const max = viewport.scrollHeight - viewport.clientHeight;
    const ratio = max > 0 ? viewport.scrollTop / max : 0;
    const h = Math.max(30, viewport.clientHeight * (viewport.clientHeight / viewport.scrollHeight));
    gthumb.style.height = h + 'px';
    gthumb.style.top = (ratio * (viewport.clientHeight - h)) + 'px';
  }
  function gScrollToFinger(y) {
    if (!viewport) return;
    const rect = gstrip.getBoundingClientRect();
    const max = viewport.scrollHeight - viewport.clientHeight;
    if (max <= 0) return;
    const ratio = Math.min(1, Math.max(0, (y - rect.top) / rect.height));
    viewport.scrollTop = ratio * max;
    stickToBottom = ratio >= 0.98;
    gline.style.top = (y - rect.top) + 'px';
    gUpdateThumb();
  }
  gstrip.addEventListener('touchstart', (e) => {
    e.preventDefault();
    gDragging = true;
    gstrip.classList.add('dragging');
    gScrollToFinger(e.touches[0].clientY);
  }, { passive: false });
  gstrip.addEventListener('touchmove', (e) => {
    if (!gDragging) return;
    e.preventDefault();
    gScrollToFinger(e.touches[0].clientY);
  }, { passive: false });
  gstrip.addEventListener('touchend', () => {
    gDragging = false;
    gstrip.classList.remove('dragging');
    refreshScrollHint();
  });
  gstrip.addEventListener('mousedown', (e) => {
    gDragging = true;
    gstrip.classList.add('dragging');
    gScrollToFinger(e.clientY);
    const move = (ev) => gScrollToFinger(ev.clientY);
    const up = () => { gDragging = false; gstrip.classList.remove('dragging'); refreshScrollHint(); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  });
  viewport.addEventListener('scroll', gUpdateThumb, { passive: true });

  // ---- Pause output: buffer incoming writes while ON so the user can
  // read; resume flushes the buffer. Auto-engages when scrolling up. ----
  const pauseBtn = document.getElementById('kPause');
  let paused = false;
  let pauseBuf = '';
  let pauseFlushTimer = null;
  // rAF-coalesced output writes (declared here; used in onmessage).
  const origWrite = term.write.bind(term);
  let writeQueue = '';
  let writeRaf = null;
  function setPaused(v) {
    paused = v;
    pauseBtn.classList.toggle('latched', paused);
    pauseBtn.textContent = paused ? '⏸ ' + Math.ceil(pauseBuf.length / 1024) + 'K' : '⏸';
    if (!paused) {
      // Flush buffered output in one go.
      const data = pauseBuf;
      pauseBuf = '';
      if (data) { origWrite(data); if (stickToBottom) scrollToLatest(); }
      clearTimeout(pauseFlushTimer);
      pauseFlushTimer = null;
    }
  }
  pauseBtn.addEventListener('click', () => setPaused(!paused));
  // Auto-pause: while output is streaming, scrolling up (away from the
  // bottom) pauses output so the flood can't yank the view around.
  let outgoingSinceScroll = false;
  viewport.addEventListener('scroll', () => {
    gUpdateThumb();
    if (!paused && !atBottom() && outgoingSinceScroll) {
      setPaused(true);
      outgoingSinceScroll = false;
    }
  }, { passive: true });

  scrollHint.addEventListener('click', () => { stickToBottom = true; scrollToLatest(); refreshScrollHint(); });

  // --- Toolbar: arrows / Esc / Tab / Ctrl / Shift send real PTY input ---
  function sendKeys(seq) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data: seq }));
    // NOTE: no term.focus() here — focusing xterm's textarea on Android
    // forces the soft keyboard open. Toolbar keys work without the keyboard.
  }
  const KEYS = {
    kUp: '\x1b[A', kDown: '\x1b[B', kRight: '\x1b[C', kLeft: '\x1b[D',
    kEsc: '\x1b', kTab: '\t', kEnter: '\r',
  };
  // Shifted variants: Shift+Tab is a macro, shifted arrows select text.
  const SHIFT_KEYS = {
    kTab: '\x1b[Z', // Shift+Tab
    kUp: '\x1b[1;2A', kDown: '\x1b[1;2B', kRight: '\x1b[1;2C', kLeft: '\x1b[1;2D',
  };

  // Ctrl latch: tap once for the next key (Ctrl+C, Ctrl+D…), double-tap to hold.
  const ctrlBtn = document.getElementById('kCtrl');
  let ctrlLatched = false;
  let ctrlHold = false;
  let ctrlTapTimer = null;
  function setCtrlUI() {
    ctrlBtn.classList.toggle('latched', ctrlLatched || ctrlHold);
    ctrlBtn.textContent = (ctrlLatched ? 'Ctrl… ' : ctrlHold ? 'CTRL ON ' : 'Ctrl ') + (ctrlLatched ? '1×' : ctrlHold ? '⏻' : '');
  }
  function clearCtrl() {
    ctrlLatched = false;
    ctrlHold = false;
    clearTimeout(ctrlTapTimer);
    setCtrlUI();
  }
  ctrlBtn.addEventListener('click', () => {
    clearTimeout(ctrlTapTimer);
    if (ctrlLatched) { ctrlHold = true; ctrlLatched = false; setCtrlUI(); return; }
    ctrlLatched = true;
    setCtrlUI();
    // If no key follows within 1.6s, the latch expires.
    ctrlTapTimer = setTimeout(() => { ctrlLatched = false; setCtrlUI(); }, 1600);
  });

  // Shift latch: tap once for the next key (Shift+Tab, Shift+arrow, uppercase),
  // double-tap to hold (like caps lock). Independent of Ctrl.
  const shiftBtn = document.getElementById('kShift');
  let shiftLatched = false;
  let shiftHold = false;
  let shiftTapTimer = null;
  function setShiftUI() {
    shiftBtn.classList.toggle('latched', shiftLatched || shiftHold);
    shiftBtn.textContent = (shiftLatched ? 'Shift… ' : shiftHold ? 'SHIFT ON ' : 'Shift ') + (shiftLatched ? '1×' : shiftHold ? '⏻' : '');
  }
  function clearShift() {
    shiftLatched = false;
    shiftHold = false;
    clearTimeout(shiftTapTimer);
    setShiftUI();
  }
  shiftBtn.addEventListener('click', () => {
    clearTimeout(shiftTapTimer);
    if (shiftLatched) { shiftHold = true; shiftLatched = false; setShiftUI(); return; }
    shiftLatched = true;
    setShiftUI();
    shiftTapTimer = setTimeout(() => { shiftLatched = false; setShiftUI(); }, 1600);
  });

  for (const [id, seq] of Object.entries(KEYS)) {
    document.getElementById(id).addEventListener('click', () => {
      // Apply a latched/hold Ctrl to letter keys (single-char sequences only).
      if (ctrlLatched || ctrlHold) {
        const c = seq.charCodeAt(0);
        if (c >= 0x61 && c <= 0x7a) { sendKeys(String.fromCharCode(c - 0x60)); clearCtrl(); return; }
      }
      // Apply latched/hold Shift: Shift+Tab macro, shifted arrows, uppercase.
      if (shiftLatched || shiftHold) {
        const shifted = SHIFT_KEYS[id];
        if (shifted) { sendKeys(shifted); clearShift(); return; }
        const c = seq.charCodeAt(0);
        if (c >= 0x61 && c <= 0x7a) { sendKeys(String.fromCharCode(c - 0x20)); clearShift(); return; } // uppercase
      }
      sendKeys(seq);
    });
  }

  // --- Keyboard control: it only opens on an explicit ⌨ tap; the lock
  // prevents it from EVER opening — even tapping a text box or the terminal
  // won't raise the keyboard. The lock is PERSISTENT.
  const kbBtn = document.getElementById('kbBtn');
  const kbLockBtn = document.getElementById('kbLock');
  let keyboardOpen = false;
  let kbLock = false;
  try { kbLock = localStorage.getItem('tty_kb_lock') === '1'; } catch {}
  function setKbUI() {
    kbBtn.classList.toggle('latched', keyboardOpen);
    kbBtn.textContent = keyboardOpen ? '⌨ on' : '⌨';
    kbLockBtn.classList.toggle('locked', kbLock);
    kbLockBtn.textContent = kbLock ? '🔒 OFF' : '🔒';
    kbLockBtn.title = kbLock ? 'Keyboard is OFF. Tap to enable.' : 'Keyboard is ON. Tap to disable.';
  }
  function focusTerminal(preventScroll) {
    // Focus xterm without letting Android pop the keyboard (blur() first
    // keeps the IME from re-attaching to the hidden textarea).
    if (kbLock) return; // locked: never focus the terminal textarea
    try { term.blur(); } catch {}
    term.focus({ preventScroll: !!preventScroll });
  }
  kbBtn.addEventListener('click', () => {
    if (kbLock) return; // locked: must unlock first
    keyboardOpen = !keyboardOpen;
    if (keyboardOpen) {
      focusTerminal(false);
    } else {
      try { term.blur(); } catch {}
      try { document.activeElement && document.activeElement.blur(); } catch {}
    }
    setKbUI();
  });
  kbLockBtn.addEventListener('click', () => {
    kbLock = !kbLock;
    try { localStorage.setItem('tty_kb_lock', kbLock ? '1' : '0'); } catch {}
    if (kbLock) {
      // Locking hides the keyboard immediately and never lets it return.
      keyboardOpen = false;
      try { term.blur(); } catch {}
      try { document.activeElement && document.activeElement.blur(); } catch {}
    }
    setKbUI();
  });

  let ws = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  let currentTab = null; // { id, session, label }
  let tabs = []; // { id, session, label }
  const LS_TABS = 'tty_tabs_v1';
  const LS_PREFIX = 'tty_session_';

  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusText.textContent = text || (state === 'on' ? 'connected' : state === 'off' ? 'disconnected' : 'connecting');
  }

  function saveTabs() {
    try { localStorage.setItem(LS_TABS, JSON.stringify(tabs)); } catch {}
  }
  function loadTabs() {
    try { return JSON.parse(localStorage.getItem(LS_TABS)) || []; } catch { return []; }
  }
  function tabLabel(i) { return 'Terminal ' + (i + 1); }

  function renderTabs() {
    const bar = document.getElementById('tabbar');
    bar.innerHTML = '';
    tabs.forEach((t, i) => {
      const el = document.createElement('div');
      const active = currentTab && t.id === currentTab.id;
      el.className = 'tab' + (active ? ' active' : '');
      const lbl = document.createElement('span');
      lbl.textContent = t.label || tabLabel(i);
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '×';
      x.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.id); });
      el.appendChild(lbl);
      el.appendChild(x);
      el.addEventListener('click', () => switchTab(t.id));
      bar.appendChild(el);
    });
    const add = document.createElement('button');
    add.id = 'tabAdd';
    add.textContent = '+';
    add.title = 'New terminal tab';
    add.addEventListener('click', () => addTab());
    bar.appendChild(add);
  }

  function addTab() {
    const t = { id: 'tab' + Date.now() + Math.random().toString(36).slice(2, 6), session: null, label: tabLabel(tabs.length) };
    tabs.push(t);
    saveTabs();
    switchTab(t.id, true);
  }

  function switchTab(tabId, forceNew) {
    const t = tabs.find((x) => x.id === tabId);
    if (!t) return;
    currentTab = t;
    saveTabs();
    renderTabs();
    // Detach current socket (session keeps running on the server).
    if (ws) { try { ws.close(); } catch {} ws = null; }
    clearTimeout(reconnectTimer);
    term.reset();
    stickToBottom = true;
    scrollToLatest();
    connect();
  }

  async function closeTab(tabId) {
    const t = tabs.find((x) => x.id === tabId);
    if (!t) return;
    if (!confirm('Close ' + (t.label || 'this terminal') + '? Its session will be terminated.')) return;
    if (t.session) {
      try {
        await fetch('/api/tty/sessions/' + t.session + '/end', { method: 'POST', headers: authHeaders() });
      } catch {}
    }
    tabs = tabs.filter((x) => x.id !== tabId);
    try { localStorage.removeItem(LS_PREFIX + tabId); } catch {}
    if (currentTab.id === tabId) {
      if (tabs.length) {
        currentTab = tabs[0];
        renderTabs();
        if (ws) { try { ws.close(); } catch {} ws = null; }
        term.reset();
        stickToBottom = true;
        scrollToLatest();
        connect();
      } else {
        currentTab = null;
        renderTabs();
        // Close the socket too so a late server message can't crash the UI.
        if (ws) { try { ws.close(); } catch {} ws = null; }
        clearTimeout(reconnectTimer);
        setStatus('off', 'No tabs. Tap + to create one.');
      }
    } else {
      saveTabs();
      renderTabs();
    }
  }

  function authHeaders() {
    const t = token;
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (!currentTab) { setStatus('off', 'No tabs. Tap + to create one.'); return; }
    setStatus('', 'connecting');
    const base = `${proto}://${location.host}/ws` + (token ? `?token=${encodeURIComponent(token)}` : '');
    const url = currentTab.session ? `${base}&session=${encodeURIComponent(currentTab.session)}` : base;
    const sock = new WebSocket(url);
    ws = sock;
    sock.onopen = () => {
      if (sock !== ws) return; // stale socket (tab switched)
      setStatus('on');
      reconnectDelay = 1000;
      sock.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      stickToBottom = true;
      scrollToLatest();
    };
    sock.onclose = () => {
      if (sock !== ws) return; // stale socket
      // If this tab was closed while connecting, don't reconnect to it.
      if (!currentTab || !tabs.find((x) => x.id === currentTab.id)) return;
      setStatus('off', 'disconnected. Tap to reconnect');
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };
    sock.onerror = () => sock.close();
    sock.onmessage = (e) => {
      if (sock !== ws) return; // stale socket
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'hello') {
        // Reconcile: server may have assigned a fresh id (server restarted).
        currentTab.session = msg.session;
        saveTabs();
        // Replay: don't wipe scroll if the user was reading — only reset
        // when they were at the bottom (fresh follow).
        if (msg.replay) {
          const wasAtBottom = atBottom();
          if (wasAtBottom) { term.reset(); stickToBottom = true; }
          else setPaused(true); // flood protection while reading
        }
      } else if (msg.type === 'output') {
        if (paused) {
          // Buffer while paused; show live K-badge.
          pauseBuf += msg.data;
          pauseBtn.textContent = '⏸ ' + Math.ceil(pauseBuf.length / 1024) + 'K';
          if (!pauseFlushTimer) pauseFlushTimer = setTimeout(() => setPaused(true), 500); // refresh badge
          return;
        }
        outgoingSinceScroll = true;
        // rAF-coalesced writes: batch chunks into one write per frame.
        writeQueue += msg.data;
        if (!writeRaf) {
          writeRaf = requestAnimationFrame(() => {
            writeRaf = null;
            const data = writeQueue;
            writeQueue = '';
            origWrite(data);
            if (stickToBottom) scrollToLatest();
          });
        }
      }
      else if (msg.type === 'size') {
        try { term.resize(msg.cols, msg.rows); } catch {}
      } else if (msg.type === 'exit') {
        setStatus('off', 'session ended');
        term.write('\r\n[process exited]\r\n');
        currentTab.session = null;
        saveTabs();
      }
    };
  }
  // Tap the header/status to reconnect immediately.
  document.querySelector('header').addEventListener('click', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) { clearTimeout(reconnectTimer); connect(); }
  });

  // --- Tab reconciliation on load: restore live sessions, drop dead ones ---
  (async function bootTabs() {
    const saved = loadTabs();
    let live = [];
    try {
      const r = await fetch('/api/tty/sessions', { headers: authHeaders() });
      if (r.ok) {
        const j = await r.json();
        live = (j.sessions || []).map((s) => s.id);
      }
    } catch {}
    tabs = saved.filter((t) => t.session && live.includes(t.session));
    if (!tabs.length) {
      // Nothing to restore: fresh single tab.
      tabs = [{ id: 'tab' + Date.now(), session: null, label: 'Terminal 1' }];
      saveTabs();
    }
    currentTab = tabs[0];
    renderTabs();
    connect();
  })();

  term.onData((data) => {
    // A latched/hold Ctrl also applies to the next character typed on the
    // phone's soft keyboard (Ctrl+C, Ctrl+D, Ctrl+L…).
    if (ctrlLatched || ctrlHold) {
      if (data.length === 1) {
        const c = data.charCodeAt(0);
        if (c >= 0x61 && c <= 0x7a) { data = String.fromCharCode(c - 0x60); clearCtrl(); }
        else if (c >= 0x41 && c <= 0x5a) { data = String.fromCharCode(c - 0x40); clearCtrl(); }
      }
    }
    // A latched/hold Shift uppercases the next typed letter.
    if (shiftLatched || shiftHold) {
      if (data.length === 1) {
        const c = data.charCodeAt(0);
        if (c >= 0x61 && c <= 0x7a) { data = String.fromCharCode(c - 0x20); clearShift(); }
        else if (c >= 0x41 && c <= 0x5a) { clearShift(); }
      }
    }
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data }));
  });

  window.addEventListener('resize', () => {
    fit.fit();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
    refreshScrollHint();
  });

  // Tap to focus WITHOUT popping the keyboard on mobile (a real tap only
  // moves focus to xterm; the IME stays closed until ⌨ is tapped). Swipes
  // to scroll never focus at all. Taps on the scrollbar never focus either.
  let tapStart = null;
  termEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    // Ignore taps that land on the scrollbar (right edge of the viewport).
    const vp = termEl.querySelector('.xterm-viewport');
    if (vp) {
      const r = vp.getBoundingClientRect();
      const sbW = 14; // approximate scrollbar width
      if (t.clientX > r.right - sbW && vp.scrollHeight > vp.clientHeight) {
        tapStart = null;
        return;
      }
    }
    tapStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  termEl.addEventListener('touchend', (e) => {
    if (!tapStart) return;
    const dx = e.changedTouches[0].clientX - tapStart.x;
    const dy = e.changedTouches[0].clientY - tapStart.y;
    tapStart = null;
    if (Math.hypot(dx, dy) < 10) {
      if (!kbLock) focusTerminal(true);
    }
  }, { passive: true });
  termEl.addEventListener('click', (e) => {
    // Only treat clicks on the terminal itself (not the scrollbar) as focus.
    if (e.offsetX !== undefined && e.target && e.target.closest) {
      const vp = termEl.querySelector('.xterm-viewport');
      if (vp && vp.scrollHeight > vp.clientHeight) {
        const r = vp.getBoundingClientRect();
        if (e.clientX > r.right - 14) return; // scrollbar
      }
    }
    if (!kbLock) focusTerminal(true);
  });

  // (Output writes are batched via writeQueue + rAF in onmessage; scroll
  // follow is rAF-coalesced in scrollToLatest. No per-write override needed.)

  // HARD BLOCK when locked: even if the browser/WebView tries to focus
  // xterm's hidden textarea (tap on scrollbar, tap on terminal, etc.), blur
  // it immediately so the keyboard can never appear.
  document.addEventListener('focusin', (e) => {
    if (kbLock && e.target && e.target.tagName === 'TEXTAREA') {
      try { e.target.blur(); } catch {}
    }
  }, true);

  // Tab boot (async) handles the initial connect.
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
