<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Command Code Remote</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --user-bubble: #1e3a5f;
    --assistant-bubble: #1c2029;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  /* --- Sidebar (desktop) --- */
  .sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar .brand .logo {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #4f8cff, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .sidebar .brand h1 { font-size: 15px; font-weight: 600; }
  .new-chat {
    margin: 12px;
    padding: 10px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }
  .new-chat:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-section-label {
    padding: 10px 14px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .session-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .session-item {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
  }
  .session-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .session-item.active { background: rgba(79,140,255,.12); color: var(--text); }
  .session-item .del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: none; background: none; border: none; color: var(--error);
    font-size: 14px; cursor: pointer; padding: 2px 6px;
  }
  .session-item:hover .del { display: block; }
  .sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  /* --- Main chat --- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #4f8cff, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  header h2 { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menuBtn { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb020; }
  .status .dot.on { background: #34d399; }
  .status .dot.off { background: #ff6b6b; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; background: rgba(255,107,107,.1); border: 1px solid var(--error); color: var(--error); font-size: 13px; }
  .msg.tool {
    align-self: flex-start;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px 10px;
  }
  .msg.thinking { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 6px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    resize: none;
    max-height: 120px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #send, #stop {
    width: 42px; height: 42px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stop { background: var(--error); display: none; }
  #send:disabled { opacity: .5; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 16px 10px; }

  /* --- Login gate --- */
  #login {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  #login .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #4f8cff, #7c5cff); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; }
  #login h1 { font-size: 20px; }
  #login p { color: var(--muted); font-size: 13px; text-align: center; max-width: 320px; line-height: 1.5; }
  #login input {
    width: 100%; max-width: 320px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 15px; padding: 12px 14px; outline: none;
  }
  #login input:focus { border-color: var(--accent); }
  #login button {
    width: 100%; max-width: 320px;
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer;
  }
  #login .err { color: var(--error); font-size: 13px; min-height: 18px; }

  /* --- Slash command palette --- */
  #palette {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, calc(100% - 24px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 60;
    display: none;
    max-height: 55vh;
    overflow-y: auto;
    padding: 6px;
  }
  #palette .pal-item {
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  #palette .pal-item .pal-cmd { font-weight: 600; color: var(--accent); }
  #palette .pal-item .pal-desc { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #palette .pal-item:hover, #palette .pal-item.active { background: rgba(79,140,255,.14); }

  /* --- Mobile: sidebar becomes drawer --- */
  @media (max-width: 720px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.5); }
    .sidebar.open { transform: translateX(0); }
    #menuBtn { display: block; }
    .main { width: 100%; }
  }
</style>
</head>
<body>

<!-- Login gate -->
<div id="login" style="display:none">
  <div class="logo">&gt;_</div>
  <h1>Command Code Remote</h1>
  <p>Enter the token shown on your PC to connect to your agent.</p>
  <input id="tokenInput" type="password" placeholder="Access token" autocomplete="off">
  <button id="loginBtn">Connect</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">&gt;_</div>
    <h1>Command Code</h1>
  </div>
  <button class="new-chat" id="newChatBtn">+ New chat</button>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-section-label">Terminal sessions (synced)</div>
  <div class="session-list" id="syncList"></div>
  <div class="sidebar-footer" id="sidebarFooter">Agent runs on your PC<br>with full access (--yolo)</div>
</aside>

<!-- Main chat -->
<div class="main">
  <header>
    <button id="menuBtn">☰</button>
    <div class="logo">&gt;_</div>
    <h2 id="chatTitle">New chat</h2>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
  </header>
  <div id="messages"></div>
  <div id="palette"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Message your agent…"></textarea>
    <button id="send" title="Send">➤</button>
    <button id="stop" title="Stop">■</button>
  </footer>
  <div class="hint">Runs on your PC with full access — use responsibly</div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const messagesEl = $('messages'), inputEl = $('input'), sendBtn = $('send'), stopBtn = $('stop');
  const dot = $('dot'), statusText = $('statusText');
  const sidebar = $('sidebar'), sessionList = $('sessionList'), syncList = $('syncList'), chatTitle = $('chatTitle');
  const login = $('login'), tokenInput = $('tokenInput'), loginBtn = $('loginBtn'), loginErr = $('loginErr');
  const palette = $('palette');

  let ws = null;
  let currentSessionId = null;
  let pendingResumeId = null;
  let busy = false;
  let currentAssistantEl = null;
  let reconnectTimer = null;
  let history = [];
  let syncSessions = [];
  let paletteOpen = false;

  function token() {
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) return fromUrl;
    return localStorage.getItem('cmd_remote_token') || '';
  }
  function saveToken(t) { localStorage.setItem('cmd_remote_token', t); }
  function setToken(t) { saveToken(t); }
  function hasToken() { return !!token(); }

  function authHeaders() {
    const t = token();
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  }
  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const t = token();
    return `${proto}://${location.host}/ws` + (t ? `?token=${encodeURIComponent(t)}` : '');
  }

  function setStatus(state) {
    dot.className = 'dot ' + state;
    statusText.textContent = state === 'on' ? 'connected' : state === 'off' ? 'disconnected' : 'connecting';
  }

  function showLogin() { login.style.display = 'flex'; }
  function hideLogin() { login.style.display = 'none'; }

  // --- Connection ---
  function connect() {
    clearTimeout(reconnectTimer);
    ws = new WebSocket(wsUrl());
    ws.onopen = () => { setStatus('on'); };
    ws.onclose = () => {
      setStatus('off');
      if (busy) finishRun();
      reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      handleMessage(msg);
    };
  }

  // --- History / sessions ---
  async function loadSessions() {
    try {
      const r = await fetch('/api/sessions', { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const data = await r.json();
      history = data.sessions || [];
      renderSessionList();
    } catch {}
  }

  async function loadConversation(id) {
    try {
      const r = await fetch('/api/sessions/' + id, { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      return await r.json();
    } catch { return null; }
  }

  async function deleteConversation(id) {
    try {
      await fetch('/api/sessions/' + id, { method: 'DELETE', headers: authHeaders() });
      if (currentSessionId === id) newChat();
      loadSessions();
    } catch {}
  }

  function renderSessionList() {
    sessionList.innerHTML = '';
    for (const s of history) {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      item.textContent = s.title || s.id;
      item.onclick = () => openConversation(s.id);
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.onclick = (e) => { e.stopPropagation(); if (confirm('Delete this conversation?')) deleteConversation(s.id); };
      item.appendChild(del);
      sessionList.appendChild(item);
    }
    if (!history.length) {
      const empty = document.createElement('div');
      empty.className = 'session-item';
      empty.style.cursor = 'default';
      empty.textContent = 'No past conversations';
      sessionList.appendChild(empty);
    }
  }

  async function openConversation(id) {
    if (busy) return;
    const conv = await loadConversation(id);
    if (!conv) return;
    currentSessionId = conv.id;
    chatTitle.textContent = conv.title || 'Conversation';
    messagesEl.innerHTML = '';
    for (const m of conv.messages) {
      if (m.role === 'user') addMsg(m.content, 'user');
      else if (m.role === 'assistant') addMsg(m.content, 'assistant');
      else if (m.role === 'error') addMsg(m.content, 'error');
    }
    renderSessionList();
    closeSidebarOnMobile();
  }

  // --- Terminal session sync ---
  async function loadSyncSessions() {
    try {
      const r = await fetch('/api/sync/sessions', { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const data = await r.json();
      syncSessions = data.sessions || [];
      renderSyncList();
    } catch {}
  }

  function renderSyncList() {
    syncList.innerHTML = '';
    if (!syncSessions.length) {
      const empty = document.createElement('div');
      empty.className = 'session-item';
      empty.style.cursor = 'default';
      empty.textContent = 'No terminal sessions found';
      syncList.appendChild(empty);
      return;
    }
    for (const s of syncSessions.slice(0, 30)) {
      const item = document.createElement('div');
      item.className = 'session-item';
      const d = new Date(s.mtime);
      const timeStr = d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      item.textContent = `${s.title} — ${timeStr}`;
      item.title = `Continue terminal session ${s.id}`;
      item.onclick = () => openTerminalSession(s.id);
      syncList.appendChild(item);
    }
  }

  async function openTerminalSession(id) {
    if (busy) return;
    try {
      const r = await fetch('/api/sync/session/' + id, { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const conv = await r.json();
      currentSessionId = null; // terminal sessions use their own context; new proxy conv
      pendingResumeId = id;
      chatTitle.textContent = 'Terminal: ' + id.slice(0, 8);
      messagesEl.innerHTML = '';
      addMsg('Continuing terminal session ' + id + '. Send a message to continue it on your PC.', 'thinking');
      for (const m of conv.messages.slice(-40)) {
        if (m.role === 'user') addMsg(m.content, 'user');
        else if (m.role === 'assistant') addMsg(m.content, 'assistant');
      }
      // Bind the terminal session to a fresh proxy conversation via /resume.
      ws.send(JSON.stringify({ type: 'chat', text: '/resume ' + id, sessionId: null, yolo: true }));
      closeSidebarOnMobile();
    } catch { addMsg('Could not load terminal session.', 'error'); }
  }

  function newChat() {
    if (busy) return;
    currentSessionId = null;
    pendingResumeId = null;
    chatTitle.textContent = 'New chat';
    messagesEl.innerHTML = '';
    renderSessionList();
    closeSidebarOnMobile();
    inputEl.focus();
  }

  // --- Messages ---
  function addMsg(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'run_start':
        busy = true;
        sendBtn.disabled = true;
        stopBtn.style.display = 'flex';
        break;
      case 'tool':
        addMsg('🛠 ' + msg.name + ' — ' + (msg.description || ''), 'tool');
        break;
      case 'delta':
        if (!currentAssistantEl) currentAssistantEl = addMsg('', 'assistant cursor');
        currentAssistantEl.textContent += msg.text;
        currentAssistantEl.classList.remove('cursor');
        currentAssistantEl.classList.add('cursor');
        messagesEl.scrollTop = messagesEl.scrollHeight;
        break;
      case 'stderr':
        if (!currentAssistantEl) addMsg(msg.text, 'thinking');
        break;
      case 'run_end':
        if (msg.sessionId) currentSessionId = msg.sessionId;
        finishRun();
        loadSessions();
        loadSyncSessions();
        break;
      case 'cleared':
        newChat();
        break;
      case 'error':
        addMsg(msg.message, 'error');
        finishRun();
        break;
    }
  }

  function finishRun() {
    busy = false;
    sendBtn.disabled = false;
    stopBtn.style.display = 'none';
    if (currentAssistantEl) currentAssistantEl.classList.remove('cursor');
    currentAssistantEl = null;
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    // If we're still waiting on a /resume binding, queue the message for that
    // terminal session instead of starting a fresh conversation.
    let sid = currentSessionId;
    if (pendingResumeId && !sid) {
      ws.send(JSON.stringify({ type: 'chat', text: '/resume ' + pendingResumeId, sessionId: null, yolo: true }));
      pendingResumeId = null;
    }
    if (chatTitle.textContent === 'New chat') {
      chatTitle.textContent = text.length > 40 ? text.slice(0, 40) + '…' : text;
    }
    ws.send(JSON.stringify({ type: 'chat', text, sessionId: sid, yolo: true }));
  }

  // --- Mobile sidebar ---
  function closeSidebarOnMobile() {
    if (window.innerWidth <= 720) sidebar.classList.remove('open');
  }
  $('menuBtn').onclick = () => sidebar.classList.toggle('open');

  // --- Slash command palette ---
  const PALETTE_COMMANDS = [
    '/help', '/clear', '/new', '/model <id>', '/models', '/effort <level>',
    '/mode <yolo|auto-accept|plan>', '/plan [off]', '/status', '/sessions',
    '/resume <id>', '/mcp', '/skills', '/mods', '/taste', '/whoami', '/info', '/version', '/todo',
  ];
  function showPalette(filter) {
    paletteOpen = true;
    palette.style.display = 'block';
    renderPalette(filter || '');
  }
  function hidePalette() {
    paletteOpen = false;
    palette.style.display = 'none';
  }
  function renderPalette(filter) {
    palette.innerHTML = '';
    const f = filter.toLowerCase();
    const matches = PALETTE_COMMANDS.filter((c) => c.includes(f));
    if (!matches.length) {
      const item = document.createElement('div');
      item.className = 'pal-item';
      item.textContent = 'No commands match';
      palette.appendChild(item);
      return;
    }
    for (const cmd of matches) {
      const [name, ...descParts] = cmd.split(' ');
      const item = document.createElement('div');
      item.className = 'pal-item';
      const c = document.createElement('span');
      c.className = 'pal-cmd';
      c.textContent = name;
      const d = document.createElement('span');
      d.className = 'pal-desc';
      d.textContent = descParts.join(' ');
      item.appendChild(c);
      item.appendChild(d);
      item.onclick = () => {
        inputEl.value = cmd;
        inputEl.focus();
        hidePalette();
      };
      palette.appendChild(item);
    }
  }

  // --- Events ---
  stopBtn.onclick = () => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'stop' })); };
  sendBtn.onclick = send;
  $('newChatBtn').onclick = newChat;
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (paletteOpen) { hidePalette(); return; }
      send();
    } else if (e.key === 'Escape') {
      hidePalette();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    const val = inputEl.value;
    if (val.startsWith('/') && !val.includes(' ')) {
      showPalette(val.slice(1));
    } else {
      hidePalette();
    }
  });

  // --- Boot: token gate, then connect ---
  async function boot() {
    if (!hasToken()) {
      showLogin();
      loginBtn.onclick = () => {
        const t = tokenInput.value.trim();
        if (!t) { loginErr.textContent = 'Enter the token from your PC.'; return; }
        setToken(t);
        hideLogin();
        boot();
      };
      return;
    }
    hideLogin();
    // Verify token works before connecting
    try {
      const r = await fetch('/api/status', { headers: authHeaders() });
      if (!r.ok) { throw new Error('bad token'); }
    } catch {
      // Token may be stale/wrong — re-prompt, keep stored
      showLogin();
      loginErr.textContent = 'That token did not work. Check it on your PC.';
      loginBtn.onclick = () => {
        const t = tokenInput.value.trim();
        if (!t) { loginErr.textContent = 'Enter the token from your PC.'; return; }
        setToken(t);
        hideLogin();
        boot();
      };
      return;
    }
    connect();
    loadSessions();
    loadSyncSessions();
  }

  boot();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
