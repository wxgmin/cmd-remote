<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Command Code Remote</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-grad-1: rgba(139, 92, 246, 0.14);
    --bg-grad-2: rgba(6, 182, 212, 0.12);
    --panel: rgba(255, 255, 255, 0.045);
    --panel-solid: #13161d;
    --border: rgba(255, 255, 255, 0.09);
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --accent: #7c8cff;
    --grad: linear-gradient(135deg, #8b5cf6, #06b6d4);
    --user-bubble: linear-gradient(135deg, rgba(139,92,246,.28), rgba(6,182,212,.22));
    --assistant-bubble: rgba(255, 255, 255, 0.05);
    --error: #ff6b81;
    --radius: 18px;
    --glow: 0 0 40px rgba(139, 92, 246, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }
  /* Ambient gradient blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }
  body::before { width: 480px; height: 480px; top: -160px; right: -120px; background: var(--bg-grad-1); }
  body::after { width: 420px; height: 420px; bottom: -140px; left: -100px; background: var(--bg-grad-2); }
  .sidebar, .main { position: relative; z-index: 1; }

  /* --- Logo mark --- */
  .logo-mark {
    width: 34px; height: 34px;
    border-radius: 11px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff;
    box-shadow: 0 4px 18px rgba(139, 92, 246, 0.45);
    flex-shrink: 0;
    position: relative;
  }
  .logo-mark svg { width: 62%; height: 62%; }

  /* --- Sidebar --- */
  .sidebar {
    width: 268px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    gap: 11px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .sidebar .brand .tag {
    font-size: 10px; color: var(--muted); font-weight: 500;
    background: rgba(255,255,255,.06); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 20px; margin-left: auto;
  }
  .new-chat {
    margin: 14px 12px 8px;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--grad);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 6px 24px rgba(139, 92, 246, 0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .new-chat:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(139, 92, 246, 0.5); }
  .sidebar-section-label {
    padding: 12px 16px 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .session-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; }
  .session-item {
    padding: 9px 12px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
    transition: background .12s ease, color .12s ease;
  }
  .session-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .session-item.active { background: linear-gradient(135deg, rgba(139,92,246,.22), rgba(6,182,212,.14)); color: var(--text); }
  .session-item .del {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    display: none; background: none; border: none; color: var(--error);
    font-size: 14px; cursor: pointer; padding: 2px 6px;
  }
  .session-item:hover .del { display: block; }
  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* --- Main chat --- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  header .logo-mark { width: 30px; height: 30px; border-radius: 10px; }
  header h2 { font-size: 15px; font-weight: 650; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  #menuBtn { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .status {
    font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 20px; font-weight: 500;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 8px currentColor; }
  .status .dot.on { background: #34d399; }
  .status .dot.off { background: #ff6b81; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .msg {
    max-width: min(88%, 640px);
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: msg-in .18s ease;
  }
  @keyframes msg-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid rgba(139,92,246,.25); border-bottom-right-radius: 6px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 6px; backdrop-filter: blur(8px); }
  .msg.error { align-self: center; background: rgba(255,107,129,.1); border: 1px solid rgba(255,107,129,.35); color: var(--error); font-size: 13px; }
  .msg.tool {
    align-self: flex-start;
    background: rgba(255,255,255,.03);
    border: 1px dashed rgba(255,255,255,.14);
    color: var(--muted);
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 7px 11px;
    border-radius: 10px;
  }
  .msg.thinking { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 8px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 12px 14px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 15px;
    resize: none;
    max-height: 120px;
    outline: none;
    font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus { border-color: rgba(139,92,246,.55); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  #send, #stop {
    width: 46px; height: 46px;
    border: none;
    border-radius: 15px;
    background: var(--grad);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(139, 92, 246, 0.4);
    transition: transform .12s ease;
  }
  #send:hover { transform: scale(1.05); }
  #stop { background: linear-gradient(135deg, #ff6b81, #f59e0b); display: none; }
  #send:disabled { opacity: .5; transform: none; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 16px 10px; }
  /* Jump-to-latest pill, shown while user is scrolled up */
  #jumpLatest {
    position: absolute;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: none;
    background: var(--grad);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(139, 92, 246, 0.45);
  }

  /* --- Login gate --- */
  #login {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  #login .logo-mark { width: 72px; height: 72px; border-radius: 22px; font-size: 34px; box-shadow: 0 10px 50px rgba(139, 92, 246, 0.5); }
  #login h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  #login p { color: var(--muted); font-size: 13px; text-align: center; max-width: 320px; line-height: 1.55; }
  #login input {
    width: 100%; max-width: 320px;
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); font-size: 15px; padding: 13px 15px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #login input:focus { border-color: rgba(139,92,246,.55); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  #login button {
    width: 100%; max-width: 320px;
    background: var(--grad); border: none; border-radius: 14px;
    color: #fff; font-size: 15px; font-weight: 650; padding: 13px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
    transition: transform .12s ease;
  }
  #login button:hover { transform: translateY(-1px); }
  #login .err { color: var(--error); font-size: 13px; min-height: 18px; }

  /* --- Slash command palette --- */
  #palette {
    position: absolute;
    bottom: 74px;
    left: 50%;
    transform: translateX(-50%);
    width: min(430px, calc(100% - 24px));
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), var(--glow);
    z-index: 60;
    display: none;
    max-height: 55vh;
    overflow-y: auto;
    padding: 8px;
  }
  #palette .pal-item {
    padding: 10px 13px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    display: flex; align-items: baseline; gap: 8px;
  }
  #palette .pal-item .pal-cmd { font-weight: 650; color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  #palette .pal-item .pal-desc { color: var(--muted); font-size: 12px; }
  #palette .pal-item:hover, #palette .pal-item.active { background: linear-gradient(135deg, rgba(139,92,246,.2), rgba(6,182,212,.12)); }

  /* --- Mobile: sidebar becomes drawer --- */
  @media (max-width: 720px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .22s ease; box-shadow: 0 0 60px rgba(0,0,0,.7); background: var(--panel-solid); }
    .sidebar.open { transform: translateX(0); }
    #menuBtn { display: block; }
    .main { width: 100%; }
  }
</style>
</head>
<body>

<!-- Login gate -->
<div id="login" style="display:none">
  <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
  <h1>Command Code Remote</h1>
  <p>Enter the token shown on your PC to connect to your agent.</p>
  <input id="tokenInput" type="password" placeholder="Access token" autocomplete="off">
  <button id="loginBtn">Connect</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
    <h1>Command Code</h1>
    <span class="tag">REMOTE</span>
  </div>
  <button class="new-chat" id="newChatBtn">+ New chat</button>
  <div class="sidebar-section-label">Conversations</div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-section-label">Terminal sessions · synced</div>
  <div class="session-list" id="syncList"></div>
  <div class="sidebar-footer" id="sidebarFooter">Agent runs on your PC<br>with full access (--yolo)</div>
</aside>

<!-- Main chat -->
<div class="main">
  <header>
    <button id="menuBtn">☰</button>
    <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 24 L37 32 L20 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 44 h15" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg></div>
    <h2 id="chatTitle">New chat</h2>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
  </header>
  <div id="messages"></div>
  <div id="palette"></div>
  <button id="jumpLatest" title="Jump to latest">↓ Latest</button>
  <footer>
    <textarea id="input" rows="1" placeholder="Message your agent…"></textarea>
    <button id="send" title="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12 L20 4 L14 20 L11 13 Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button id="stop" title="Stop"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="#fff"/></svg></button>
  </footer>
  <div class="hint">Runs on your PC with full access. Use responsibly.</div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const messagesEl = $('messages'), inputEl = $('input'), sendBtn = $('send'), stopBtn = $('stop');
  const dot = $('dot'), statusText = $('statusText');
  const sidebar = $('sidebar'), sessionList = $('sessionList'), syncList = $('syncList'), chatTitle = $('chatTitle');
  const login = $('login'), tokenInput = $('tokenInput'), loginBtn = $('loginBtn'), loginErr = $('loginErr');
  const palette = $('palette');
  const jumpLatest = $('jumpLatest');

  let stickToBottom = true; // false once the user scrolls up; true when they return to the bottom

  let ws = null;
  let currentSessionId = null;
  let pendingResumeId = null;
  let busy = false;
  let currentAssistantEl = null;
  let reconnectTimer = null;
  let history = [];
  let syncSessions = [];
  let paletteOpen = false;

  let userEnteredToken = false;
  function token() {
    // Once the user enters a token through the login gate, it wins over any
    // stale ?token= in the URL.
    if (userEnteredToken) return localStorage.getItem('cmd_remote_token') || '';
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) return fromUrl;
    return localStorage.getItem('cmd_remote_token') || '';
  }
  function saveToken(t) { localStorage.setItem('cmd_remote_token', t); }
  function setToken(t) { userEnteredToken = true; saveToken(t); }
  function hasToken() { return !!token(); }

  function authHeaders() {
    const t = token();
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  }
  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const t = token();
    return `${proto}://${location.host}/ws` + (t ? `?token=${encodeURIComponent(t)}` : '');
  }

  function setStatus(state) {
    dot.className = 'dot ' + state;
    statusText.textContent = state === 'on' ? 'connected' : state === 'off' ? 'disconnected' : 'connecting';
  }

  function showLogin() { login.style.display = 'flex'; }
  function hideLogin() { login.style.display = 'none'; }

  // --- Connection ---
  function connect() {
    clearTimeout(reconnectTimer);
    ws = new WebSocket(wsUrl());
    ws.onopen = () => { setStatus('on'); };
    ws.onclose = () => {
      setStatus('off');
      if (busy) finishRun();
      reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      handleMessage(msg);
    };
  }

  // --- History / sessions ---
  async function loadSessions() {
    try {
      const r = await fetch('/api/sessions', { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const data = await r.json();
      history = data.sessions || [];
      renderSessionList();
    } catch {}
  }

  async function loadConversation(id) {
    try {
      const r = await fetch('/api/sessions/' + id, { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      return await r.json();
    } catch { return null; }
  }

  async function deleteConversation(id) {
    try {
      await fetch('/api/sessions/' + id, { method: 'DELETE', headers: authHeaders() });
      if (currentSessionId === id) newChat();
      loadSessions();
    } catch {}
  }

  function renderSessionList() {
    sessionList.innerHTML = '';
    for (const s of history) {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      item.textContent = s.title || s.id;
      item.onclick = () => openConversation(s.id);
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.onclick = (e) => { e.stopPropagation(); if (confirm('Delete this conversation?')) deleteConversation(s.id); };
      item.appendChild(del);
      sessionList.appendChild(item);
    }
    if (!history.length) {
      const empty = document.createElement('div');
      empty.className = 'session-item';
      empty.style.cursor = 'default';
      empty.textContent = 'No past conversations';
      sessionList.appendChild(empty);
    }
  }

  async function openConversation(id) {
    if (busy) return;
    const conv = await loadConversation(id);
    if (!conv) return;
    currentSessionId = conv.id;
    chatTitle.textContent = conv.title || 'Conversation';
    messagesEl.innerHTML = '';
    for (const m of conv.messages) {
      if (m.role === 'user') addMsg(m.content, 'user');
      else if (m.role === 'assistant') addMsg(m.content, 'assistant');
      else if (m.role === 'error') addMsg(m.content, 'error');
    }
    renderSessionList();
    closeSidebarOnMobile();
  }

  // --- Terminal session sync ---
  async function loadSyncSessions() {
    try {
      const r = await fetch('/api/sync/sessions', { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const data = await r.json();
      syncSessions = data.sessions || [];
      renderSyncList();
    } catch {}
  }

  function renderSyncList() {
    syncList.innerHTML = '';
    if (!syncSessions.length) {
      const empty = document.createElement('div');
      empty.className = 'session-item';
      empty.style.cursor = 'default';
      empty.textContent = 'No terminal sessions found';
      syncList.appendChild(empty);
      return;
    }
    for (const s of syncSessions.slice(0, 30)) {
      const item = document.createElement('div');
      item.className = 'session-item';
      const d = new Date(s.mtime);
      const timeStr = d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      item.textContent = `${s.title} · ${timeStr}`;
      item.title = `Continue terminal session ${s.id}`;
      item.onclick = () => openTerminalSession(s.id);
      syncList.appendChild(item);
    }
  }

  async function openTerminalSession(id) {
    if (busy) return;
    try {
      const r = await fetch('/api/sync/session/' + id, { headers: authHeaders() });
      if (!r.ok) throw new Error('failed');
      const conv = await r.json();
      currentSessionId = null; // terminal sessions use their own context; new proxy conv
      pendingResumeId = id;
      chatTitle.textContent = 'Terminal: ' + id.slice(0, 8);
      messagesEl.innerHTML = '';
      addMsg('Continuing terminal session ' + id + '. Send a message to continue it on your PC.', 'thinking');
      for (const m of conv.messages.slice(-40)) {
        if (m.role === 'user') addMsg(m.content, 'user');
        else if (m.role === 'assistant') addMsg(m.content, 'assistant');
      }
      // Bind the terminal session to a fresh proxy conversation via /resume.
      ws.send(JSON.stringify({ type: 'chat', text: '/resume ' + id, sessionId: null, yolo: true }));
      closeSidebarOnMobile();
    } catch { addMsg('Could not load terminal session.', 'error'); }
  }

  function newChat() {
    if (busy) return;
    currentSessionId = null;
    pendingResumeId = null;
    chatTitle.textContent = 'New chat';
    messagesEl.innerHTML = '';
    renderSessionList();
    closeSidebarOnMobile();
    inputEl.focus();
  }

  // --- Messages ---
  // Auto-scroll only while the user hasn't scrolled up (stick-to-bottom),
  // so reading earlier content is never interrupted by new output.
  function scrollToLatest() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function onScroll() {
    // Near the bottom? Re-engage auto-scroll; otherwise let the user read freely.
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
    stickToBottom = nearBottom;
    jumpLatest.style.display = nearBottom ? 'none' : 'flex';
  }
  function addMsg(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    if (stickToBottom) scrollToLatest();
    return el;
  }
  messagesEl.addEventListener('scroll', onScroll, { passive: true });
  jumpLatest.addEventListener('click', () => { stickToBottom = true; scrollToLatest(); onScroll(); });

  function handleMessage(msg) {
    switch (msg.type) {
      case 'run_start':
        busy = true;
        sendBtn.disabled = true;
        stopBtn.style.display = 'flex';
        break;
      case 'tool':
        addMsg('🛠 ' + msg.name + ' · ' + (msg.description || ''), 'tool');
        break;
      case 'delta':
        if (!currentAssistantEl) currentAssistantEl = addMsg('', 'assistant cursor');
        currentAssistantEl.textContent += msg.text;
        currentAssistantEl.classList.remove('cursor');
        currentAssistantEl.classList.add('cursor');
        if (stickToBottom) scrollToLatest();
        break;
      case 'stderr':
        if (!currentAssistantEl) addMsg(msg.text, 'thinking');
        break;
      case 'run_end':
        if (msg.sessionId) currentSessionId = msg.sessionId;
        finishRun();
        loadSessions();
        loadSyncSessions();
        break;
      case 'cleared':
        newChat();
        break;
      case 'error':
        addMsg(msg.message, 'error');
        finishRun();
        break;
    }
  }

  function finishRun() {
    busy = false;
    sendBtn.disabled = false;
    stopBtn.style.display = 'none';
    if (currentAssistantEl) currentAssistantEl.classList.remove('cursor');
    currentAssistantEl = null;
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    // If we're still waiting on a /resume binding, queue the message for that
    // terminal session instead of starting a fresh conversation.
    let sid = currentSessionId;
    if (pendingResumeId && !sid) {
      ws.send(JSON.stringify({ type: 'chat', text: '/resume ' + pendingResumeId, sessionId: null, yolo: true }));
      pendingResumeId = null;
    }
    if (chatTitle.textContent === 'New chat') {
      chatTitle.textContent = text.length > 40 ? text.slice(0, 40) + '…' : text;
    }
    ws.send(JSON.stringify({ type: 'chat', text, sessionId: sid, yolo: true }));
  }

  // --- Mobile sidebar ---
  function closeSidebarOnMobile() {
    if (window.innerWidth <= 720) sidebar.classList.remove('open');
  }
  $('menuBtn').onclick = () => sidebar.classList.toggle('open');

  // --- Slash command palette ---
  const PALETTE_COMMANDS = [
    '/help', '/clear', '/new', '/model <id>', '/models', '/effort <level>',
    '/mode <yolo|auto-accept|plan>', '/plan [off]', '/status', '/sessions',
    '/resume <id>', '/mcp', '/skills', '/mods', '/taste', '/whoami', '/info', '/version', '/todo',
  ];
  function showPalette(filter) {
    paletteOpen = true;
    palette.style.display = 'block';
    renderPalette(filter || '');
  }
  function hidePalette() {
    paletteOpen = false;
    palette.style.display = 'none';
  }
  function renderPalette(filter) {
    palette.innerHTML = '';
    const f = filter.toLowerCase();
    const matches = PALETTE_COMMANDS.filter((c) => c.includes(f));
    if (!matches.length) {
      const item = document.createElement('div');
      item.className = 'pal-item';
      item.textContent = 'No commands match';
      palette.appendChild(item);
      return;
    }
    for (const cmd of matches) {
      const [name, ...descParts] = cmd.split(' ');
      const item = document.createElement('div');
      item.className = 'pal-item';
      const c = document.createElement('span');
      c.className = 'pal-cmd';
      c.textContent = name;
      const d = document.createElement('span');
      d.className = 'pal-desc';
      d.textContent = descParts.join(' ');
      item.appendChild(c);
      item.appendChild(d);
      item.onclick = () => {
        inputEl.value = cmd;
        inputEl.focus();
        hidePalette();
      };
      palette.appendChild(item);
    }
  }

  // --- Events ---
  stopBtn.onclick = () => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'stop' })); };
  sendBtn.onclick = send;
  $('newChatBtn').onclick = newChat;
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (paletteOpen) { hidePalette(); return; }
      send();
    } else if (e.key === 'Escape') {
      hidePalette();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    const val = inputEl.value;
    if (val.startsWith('/') && !val.includes(' ')) {
      showPalette(val.slice(1));
    } else {
      hidePalette();
    }
  });

  // --- Boot: token gate, then connect ---
  async function boot() {
    if (!hasToken()) {
      showLogin();
      loginBtn.onclick = () => {
        const t = tokenInput.value.trim();
        if (!t) { loginErr.textContent = 'Enter the token from your PC.'; return; }
        setToken(t);
        hideLogin();
        boot();
      };
      return;
    }
    hideLogin();
    // Verify token works before connecting
    try {
      const r = await fetch('/api/status', { headers: authHeaders() });
      if (!r.ok) { throw new Error('bad token'); }
    } catch {
      // Token may be stale or wrong. Re-prompt, keep stored.
      showLogin();
      loginErr.textContent = 'That token did not work. Check it on your PC.';
      loginBtn.onclick = () => {
        const t = tokenInput.value.trim();
        if (!t) { loginErr.textContent = 'Enter the token from your PC.'; return; }
        setToken(t);
        hideLogin();
        boot();
      };
      return;
    }
    connect();
    loadSessions();
    loadSyncSessions();
  }

  boot();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
