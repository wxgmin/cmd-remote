name: Build Installers

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.0.0"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "CmdRemote-Android-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CmdRemote-Android
          path: CmdRemote-Android-*.apk
          if-no-files-found: error

      - name: Attach to release (tagged only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CmdRemote-Android-*.apk
          generate_release_notes: true
        # GitHub API is occasionally flaky (503). The release + artifact
        # upload are best-effort: a failed attach can be re-run manually.
        continue-on-error: true

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS --accept-source-agreements --accept-package-agreements --silent
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Rename installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ver -eq $env:GITHUB_REF_NAME) { $ver = "1.0.0" }
          Get-ChildItem CmdRemote-Setup-*.exe | Rename-Item -NewName "CmdRemote-Windows-${ver}.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CmdRemote-Windows
          path: CmdRemote-Windows-*.exe
          if-no-files-found: error

      - name: Attach to release (tagged only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CmdRemote-Windows-*.exe
          generate_release_notes: true
        # Best-effort: GitHub API can be flaky (503); re-run manually if needed.
        continue-on-error: true
